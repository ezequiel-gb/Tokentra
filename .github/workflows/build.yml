name: Native builds
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m app.main --offline-check --report offline-source.json
      - run: python -m PyInstaller packaging/tokentra.spec --noconfirm
      - run: python scripts/check_packaged.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tokentra-${{ runner.os }}-${{ runner.arch }}
          path: dist/
