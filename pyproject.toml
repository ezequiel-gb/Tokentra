[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentra"
version = "1.0.0"
description = "Precision Token Counter: private, offline OpenAI text token counting"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PySide6-Essentials==6.12.0", "tiktoken==0.14.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pyinstaller==6.22.3", "psutil==7.2.2"]

[project.scripts]
tokentra = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/tokenizers/*", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

